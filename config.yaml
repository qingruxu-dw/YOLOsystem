# YOLOsystem Configuration

# Dehazing settings
dehazing:
  enabled: true
  method: "dcp"  # dark channel prior
  omega: 0.95    # parameter for keeping a small amount of haze
  t0: 0.1        # minimum transmission threshold
  radius: 15     # guided filter radius
  eps: 0.001     # guided filter regularization

# Object detection settings (single model mode)
detection:
  model: "yolov8n.pt"  # model path or name (yolov8n, yolov8s, yolov8m, yolov8l, yolov8x)
  conf_threshold: 0.25  # confidence threshold
  iou_threshold: 0.45   # NMS IOU threshold
  max_det: 300          # maximum detections per image
  classes: null         # filter by class: [0, 1, 2, ...] or null for all classes
  device: "cpu"         # "cpu" or "cuda"

# Multi-model detection settings (for comparison)
multi_detection:
  enabled: true
  models:
    - name: "YOLOv8"
      model_path: "yolov8n.pt"
    - name: "YOLOv11"
      model_path: "yolo11n.pt"
  conf_threshold: 0.25  # confidence threshold
  iou_threshold: 0.45   # NMS IOU threshold
  max_det: 300          # maximum detections per image
  classes: null         # filter by class: [0, 1, 2, ...] or null for all classes
  device: "cpu"         # "cpu" or "cuda"

# Pipeline settings
pipeline:
  save_dehazed: true    # save dehazed images
  save_detections: true # save detection results
  save_comparison: true # save comparison images (for multi-model mode)
  output_dir: "outputs" # output directory
  show_results: false   # display results (for GUI)
