# 融合检测配置文件

# 去雾参数
dehazing:
  omega: 0.95          # 去雾程度 (0-1)，越大去雾越强
  t0: 0.1              # 最小透射率，防止除零
  radius: 15           # 导向滤波半径
  eps: 0.001           # 导向滤波正则化参数

# 检测参数
detection:
  model: "yolov8n.pt"  # YOLO模型路径 (yolov8n/s/m/l/x.pt)
  conf_threshold: 0.25 # 检测置信度阈值
  iou_threshold: 0.45  # NMS的IoU阈值
  max_det: 300         # 最大检测数量
  classes: null        # 检测的类别ID列表，null表示所有类别
  device: "cpu"        # 运行设备 (cpu/cuda)

# 融合策略参数
fusion:
  strategy: "adaptive" # 融合策略: adaptive(自适应), confidence(置信度), quality(质量), both(保留两者)
  iou_threshold: 0.5   # 匹配检测框的IoU阈值

# 流水线输出参数
pipeline:
  save_original_detection: true   # 保存原图检测结果
  save_dehazed_detection: true    # 保存去雾图检测结果
  save_fused_detection: true      # 保存融合检测结果
  save_comparison: true           # 保存三路对比图
  output_dir: "outputs/fusion"    # 输出目录
  show_results: false             # 是否显示结果窗口
